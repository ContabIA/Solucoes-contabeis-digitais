<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/styles/reset.css">
        <link rel="stylesheet" href="/styles/style.css">
        <link rel="stylesheet" href="/styles/cadastroUser.css">
        <link rel="shortcut icon" href="img/favicon_contabia.png" type="image/x-icon">
        <script src="js/editUser.js" defer></script>
        <title>ContabIA - atualizar dados</title>
    </head>
    <body>

        <header>
            <nav>
                <img src="/img/logo.png" alt="logo" class="logo">
            </nav>
        </header>

        <div id="erro" class="erro"><span id="erroText"></span></div>

        <main>
            <section class="login" id="login">

                <h1>Editar Conta</h1>

                <form action="#" method="POST" class="form" id="form">
                    <input th:attr="value=${usuario.cnpj}" type="text" name="cnpj" placeholder="CNPJ" minlength="18" maxlength="18" oninput="CnpjMask(this)"class="inputs user" id="cnpjCad" required>

                    <input th:attr="value=${usuario.email}" type="email" name="email" placeholder="E-mail" class="inputs email" id="emailCad" required>
                    
                    <button onclick="editUser()" type="button" id="button">Atualizar</button>
                </form>

                <div style="display: grid;">
                    <a style="margin: 5px; cursor: pointer;" th:attr="onclick=|changePasswordRequest('${usuario.email}')|">alterar senha</a>
                    <a style="margin: 5px;" th:href="@{/home}">voltar</a>
                </div>

            </section>
        </main>

    </body>
    <script>
        function changePasswordRequest(userEmail){
            fetch('http://localhost:8080/redefinirSenha?userEmail='+userEmail, {
                method:"POST",
            })
            .catch((error) => {console.log(error)})
        }
    </script>
</html>
