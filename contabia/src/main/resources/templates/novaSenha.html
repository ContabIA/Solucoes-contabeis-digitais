<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="/styles/reset.css">
        <link rel="stylesheet" href="/styles/style.css">
        <link rel="stylesheet" href="/styles/loginUser.css">
        <link rel="shortcut icon" href="/logo-aba-copy.ico" type="image/x-icon">
        <script src="/js/main.js" defer></script>
        <script src="/js/changePassword.js" defer></script>

        <title>ContabIA - redefinição de senha</title>
    </head>
    <body>

        <header>
            <nav>
                <img src="/img/logo.png" alt="logo" class="logo">
            </nav>
        </header>

        <main>
            <div id="erro"><span id="erroText">As senhas enviadas estão diferentes!</span></div>

            <section class="login" id="login">

                <h1>Redefinir senha</h1>

                <form class="form" id="form">

                    <label class="label_password" for="password">Digite a nova senha:</label>
                    <input name="password" id="password" type="password" placeholder="senha" class="inputs" required>

                    <label class="label_password" for="password">Confirme a nova senha:</label>
                    <input name="confirmPassword" id="confirmPassword" type="password" placeholder="senha" class="inputs" required>

                    <button type="submit" id="button">Redefinir</button>
                </form>

                <a th:href="@{/login}">Retornar para a página de login</a>
            </section>
        </main>

    </body>
</html>
