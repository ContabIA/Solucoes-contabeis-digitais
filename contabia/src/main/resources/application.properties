spring.application.name=contabia
spring.datasource.url=jdbc:mysql://localhost/contabia?createDatabaseIfNotExist=true
spring.datasource.username=${user_db:root}
spring.datasource.password=${password_db: your_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
api.security.token.secret=${JWT_SECRET:my-secret-key}

server.error.include-stacktrace = never

#enable Flyway 
spring.flyway.enabled=true 
spring.flyway.locations=classpath:db/migration